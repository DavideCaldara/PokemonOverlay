<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Team Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }

        #team {
            position: absolute;
            left: 730px; /* x */
            bottom: 20px; /* y */
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 105px;
        }

        .pokemon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*.pokemon-name {
        /*    font-size: 14px;
        /*    margin-top: 4px;
        /*}
        /*
        /*.pokemon-level {
        /*    font-size: 12px;
        /*    opacity: 0.8;
        /*}
    </style>
</head>
<body>
    <div id="team"></div>

    const sheetURL = "https://opensheet.elk.sh/1xQVNhMk2uCDmleraFebmBcHk9vCNFd3yXnNxQMLEEFo/Foglio1";

    <script>
        async function updateTeam() {
            try {

        const res = await fetch(sheetURL + "?t=" + Date.now());
        const data = await res.json();

        const container = document.getElementById("team");
        container.innerHTML = "";

        data.forEach(row => {

            const div = document.createElement("div");
            div.className = "pokemon";

            if(row["B"]){

                const num = String(row["B"]).padStart(3,'0');

                div.innerHTML = `<img src="gifs/${num}.gif">`;

            }

            container.appendChild(div);

        });

    } catch(e){

        console.error("Errore:", e);

    }
        }

        updateTeam();
        setInterval(updateTeam, 2000);
    </script>
</body>
</html>
