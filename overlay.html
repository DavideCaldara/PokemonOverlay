<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Team Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }

        #team {
            position: absolute;
            left: 730px; /* x */
            bottom: 20px; /* y */
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 105px;
        }

        .pokemon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*.pokemon-name {
        /*    font-size: 14px;
        /*    margin-top: 4px;
        /*}
        /*
        /*.pokemon-level {
        /*    font-size: 12px;
        /*    opacity: 0.8;
        /*}
    </style>
</head>
<body>
    <div id="team"></div>

    <script>
        async function updateTeam() {
            try {
                const res = await fetch("team.json?cache=" + Date.now());
                const team = await res.json();
                const container = document.getElementById("team");
                container.innerHTML = "";

                for (let i = 0; i < 6; i++) {
                    const pkm = team[i];
                    const div = document.createElement("div");
                    div.className = "pokemon";

                    if (pkm) {
                        div.innerHTML = `
              <img src="${pkm.sprite}">
            `;
                    } else {
                        div.style.visibility = "hidden"; // mantiene spazio vuoto
                    }

                    container.appendChild(div);
                }
            } catch (err) {
                console.error("Errore aggiornamento team:", err);
            }
        }

        updateTeam();
        setInterval(updateTeam, 2000);
    </script>
</body>
</html>
