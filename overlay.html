<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Team Overlay</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            overflow: hidden;
        }

        #team {
            position: absolute;
            left: 730px;
            bottom: 20px;
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 105px;
        }

        .pokemon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .pokemon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="team"></div>

    <script>
        const sheetURL = "https://opensheet.elk.sh/1xQVNhMk2uCDmleraFebmBcHk9vCNFd3yXnNxQMLEEFo/Foglio1";

        async function updateTeam() {
        try {
        const res = await fetch(sheetURL, { cache: "no-store" });
        const data = await res.json();

        const container = document.getElementById("team");
        container.innerHTML = "";

        for (let i = 0; i < 6; i++) {
        const row = data[i];
        const div = document.createElement("div");
        div.className = "pokemon";

        const pokedexNum = row && row.pokemon;

        if (pokedexNum) {
        const num = String(pokedexNum).padStart(3, '0');
        div.innerHTML = `<img src="gifs/${num}.gif">`;
        } else {
        div.style.visibility = "hidden";
        }

        container.appendChild(div);
        }

        } catch(e) {
        console.error("Errore:", e);
        }
        }

        updateTeam();
        setInterval(updateTeam, 2000);
    </script>
</body>
</html>
